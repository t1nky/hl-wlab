name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_PUBLIC_BUILD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/configure-pages@v5
        id: pages
      - run: bun install --frozen-lockfile
      - run: bun run check:repo
      - run: bun run check
        env:
          WB_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Package matching source and dependency source
        run: |
          git archive --format=tar --output=web/dist/source.tar HEAD
          tar --append --file=web/dist/source.tar node_modules/three/src node_modules/three/examples/jsm/controls/OrbitControls.js node_modules/three/LICENSE node_modules/three/package.json
          gzip web/dist/source.tar
          git rev-parse HEAD > web/dist/revision.txt
      - run: bun tools/check-pages.mjs
        env:
          WB_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
